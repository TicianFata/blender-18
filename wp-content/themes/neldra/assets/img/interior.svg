    <rect x="380" y="560" width="440" height="48" rx="10" fill="#101010"/>
    <rect x="380" y="516" width="120" height="52" rx="10" fill="#141414"/>
    <rect x="520" y="516" width="120" height="52" rx="10" fill="#141414"/>
    <rect x="660" y="516" width="120" height="52" rx="10" fill="#141414"/>
